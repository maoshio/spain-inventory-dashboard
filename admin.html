<body>
  <div class="dashboard-viewport" id="dashboard-viewport">
  <main class="dashboard" id="dashboard" data-view="age">
    <div class="notice" id="notice" role="alert"></div>
    <header class="top">
      <div>
        <p class="eyebrow">SPAIN&nbsp; / &nbsp;INVENTORY INTELLIGENCE</p>
        <h1><span data-zh="西班牙车辆库存" data-en="Spain Vehicle Inventory">西班牙车辆库存</span></h1>
      </div>
      <div class="header-actions"><nav class="language-switch" aria-label="Language"><button id="lang-zh" type="button" aria-pressed="true">中文</button><button id="lang-en" type="button" aria-pressed="false">EN</button></nav><div class="date-card"><span><span data-zh="数据日期" data-en="As of">数据日期</span></span><strong id="data-date">—</strong></div></div>
    </header>
    <section class="kpis" aria-label="关键指标 / Key metrics">
      <article class="kpi kpi-blue"><div class="kpi-title"><span data-zh="库存车辆" data-en="Vehicles in stock">库存车辆</span></div><div class="kpi-value" id="total-value">—</div><div class="kpi-detail" id="total-detail">—</div></article>
      <article class="kpi kpi-teal"><div class="kpi-title"><span data-zh="已配销售单" data-en="Sales order allocated">已配销售单</span></div><div class="kpi-value" id="sales-value">—</div><div class="kpi-detail" id="sales-detail">—</div></article>
      <article class="kpi kpi-gold"><div class="kpi-title"><span data-zh="待关联发运单" data-en="Awaiting dispatch order">待关联发运单</span></div><div class="kpi-value" id="pending-value">—</div><div class="kpi-detail" id="pending-detail">—</div></article>

  <script>(function (root, factory) {

  const WAREHOUSE_PRIORITY = ['Barcelona_Depot_PDI(in)_PASS', 'Motril_Depot_ARRIVAL', 'Salinas_Depot_PDI(in)_PASS'];
  const BARCELONA = 'Barcelona_Depot_PDI(in)_PASS';
  const ES_SALES = 'ES-sales and marketing';

  function text(value) {
    return value == null ? '' : String(value).trim();
  }

  function excelSerialFromDate(date) {
    return Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()) / 86400000 + 25569;
  }

  function localIso(date) {
    const pad=(n)=>String(n).padStart(2,'0');

  function parseDateSerial(value, date1904 = false) {

    const numeric = Number(raw);
    if (Number.isFinite(numeric) && numeric > 1000) return numeric + (date1904 ? 1462 : 0);
    const normalized = raw.replace(/年|\//g, '-').replace(/月/g, '-').replace(/日/g, '').trim();
    const match = /^(\d{4})-(\d{1,2})-(\d{1,2})(?:[ T].*)?$/.exec(normalized);
    if (!match) return null;

  function mappedWarehouse(value) {

    return name === ES_SALES ? BARCELONA : name || '未填库房';
  }

  function warehouseLabel(name) {
    if (name === BARCELONA) return 'Barcelona PDI';
    if (name === 'Motril_Depot_ARRIVAL') return 'Motril Arrival';

      if (!warehouseMap.has(warehouseName)) warehouseMap.set(warehouseName, {
        name: warehouseName, label: warehouseLabel(warehouseName), count: 0,
        age: [0, 0, 0, 0, 0], sales: 0, dispatch: 0, invalidDates: 0,
      });
      const w = warehouseMap.get(warehouseName);
      w.count++;
      if (bucket < 0) w.invalidDates++;
      else w.age[bucket]++;
      if (hasSales) w.sales++;
      if (hasSales && hasDispatch) w.dispatch++;

      const modelName = text(record.model) || '未填车型';
      if (!modelMap.has(modelName)) modelMap.set(modelName, {
        name: modelName, count: 0, sales: 0, dispatch: 0,
      });
      const m = modelMap.get(modelName);
      m.count++;
      if (hasSales) m.sales++;
      if (hasSales && hasDispatch) m.dispatch++;
    }
    const total = unique.size;
    return {
      total, sales, dispatch, pending: sales - dispatch, unallocated: total - sales,
      anomalousDispatch, duplicates, skippedBlankVin, invalidDates,
      age, warehouses: [...warehouseMap.values()].sort((a,b) => comparePriority(a,b,WAREHOUSE_PRIORITY)),
      models: [...modelMap.values()].sort((a,b) => comparePriority(a,b,MODEL_PRIORITY)),
      asOf: localIso(today),
    };
  }

  return { AGE_LABELS, aggregate, parseDateSerial, ageIndex, mappedWarehouse };
});

  <script>(function () {
  'use strict';
  const { aggregate } = window.DashboardCore;
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat('en-US');
  const percent = (n, d) => `${(d ? n / d * 100 : 0).toFixed(1)}%`;
  const number = (n) => nf.format(n || 0);
  const formatDate = (iso) => String(iso || '').slice(0,10).replaceAll('-', '.');
  const localIso = (date) => `${date.getFullYear()}-${String(date.getMonth()+1).padStart(2,'0')}-${String(date.getDate()).padStart(2,'0')}`;
  const text = (value) => value == null ? '' : String(value).trim();
  const seed = JSON.parse($('seed-data').textContent);
  const STORAGE_KEY = 'spain_inventory_dashboard_v1';
  const SHARED_MODE = window.SHARED_MODE || '';
  const API_URL = (window.DASHBOARD_API_ORIGIN || '') + '/api/dashboard';
  let language = 'zh';
  try { language = localStorage.getItem('inventory-language') === 'en' ? 'en' : 'zh'; } catch (_) {}
  const t = (zh, en) => language === 'en' ? en : zh;
  function applyLanguage() {
    document.documentElement.lang = language === 'en' ? 'en' : 'zh-CN';
    document.title = t('西班牙车辆库存', 'Spain Vehicle Inventory');
    document.querySelectorAll('[data-zh][data-en]').forEach(el => el.textContent = el.dataset[language]);
    $('lang-zh').setAttribute('aria-pressed', String(language === 'zh'));
    $('lang-en').setAttribute('aria-pressed', String(language === 'en'));
    $('admin-password').placeholder = t('上传密码', 'Upload password');
    $('admin-password').setAttribute('aria-label', t('上传密码', 'Upload password'));
  }
  let hasLiveData = !SHARED_MODE;
  let current = SHARED_MODE ? {data:aggregate([],new Date()),meta:{}} : seed;
  function fitDashboard() { /* Layout is sized directly by the viewport CSS grid. */ }

  function node(tag, className = '', value = '') {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (value !== '') element.textContent = value;
    return element;
  }

  function replaceChildren(target, children) {
    target.replaceChildren(...children);
  }

  function setNotice(messages) {
    const box = $('notice');
    box.textContent = messages.join('；');
    box.classList.toggle('visible', messages.length > 0);
    fitDashboard();
  }

  function render(data, meta = {}) {
    current = { data, meta };
    applyLanguage();
    document.body.classList.toggle('data-unavailable', !hasLiveData);
    $('data-date').textContent = formatDate(meta.loadedAt || data.asOf);
    $('source-status').textContent = t('来源：','Source: ') + (meta.sourceLabel || '西班牙库存-1109.xlsx');
    $('total-value').textContent = number(data.total);
    $('sales-value').textContent = number(data.sales);
    $('pending-value').textContent = number(data.pending);
    $('dispatch-value').textContent = number(data.dispatch);
    $('total-detail').textContent = `${t('占总库存','Of total stock')} ${percent(data.total,data.total)}`;
    $('sales-detail').textContent = `${t("占总库存", "Of total stock")} ${percent(data.sales, data.total)}`;
    $('pending-detail').textContent = `${t('占总库存','Of total stock')} ${percent(data.pending,data.total)}\n${t('已配单中','Of allocated')} ${percent(data.pending,data.sales)}`;
    $('pending-detail').title = `${t('已配单中','Of allocated')}: ${percent(data.pending,data.sales)}`;
    $('dispatch-detail').textContent = `${t('占总库存','Of total stock')} ${percent(data.dispatch,data.total)}\n${t('已配单中','Of allocated')} ${percent(data.dispatch,data.sales)}`;
    $('dispatch-detail').title = `${t('已配单中','Of allocated')}: ${percent(data.dispatch,data.sales)}`;

    const ageColors = ['#398fcd','#3281bd','#2b73ad','#286598','#245782'];
    const maxAge = Math.max(1, ...data.age.map((item) => item.count));
    const ageRows = data.age.map((item, index) => {
      const row = node('div','age-row');
      const label = node('div','age-label',language === 'en' ? item.label.replace(/ 天$/, ' days') : item.label);
      const track = node('div','age-track');
      const fill = node('div','age-fill');
      fill.style.setProperty('--width',`${item.count / maxAge * 100}%`);
      fill.style.setProperty('--fill',ageColors[index]);
      track.append(fill);
      row.append(label,track,node('div','age-count',number(item.count)),node('div','age-pct',percent(item.count,data.total)));
      return row;
    });
    replaceChildren($('age-chart'),ageRows);
    replaceChildren($('age-composition'), data.age.map((item,index) => {
      const segment = node('div','age-segment');
      segment.style.width = `${data.total ? item.count / data.total * 100 : 0}%`;
      segment.style.setProperty('--fill',ageColors[index]);
      segment.title = `${language === 'en' ? item.label.replace(/ 天$/, ' days') : item.label}: ${number(item.count)} (${percent(item.count,data.total)})`;
      return segment;
    }));
    $('age-composition').setAttribute('aria-label',t('库龄占总库存分布','Stock age as a share of total inventory'));
    const over90 = data.age[3].count + data.age[4].count;
    $('over-90').textContent = `${number(over90)} ${t("台", "units")} · ${percent(over90,data.total)}`;
    $('age-title').title = `${t('超过180天','Over 180 days')}: ${number(data.age[4].count)} (${percent(data.age[4].count,data.total)})`;
    $('over-180').textContent = `>180 ${t("天", "days")}: ${number(data.age[4].count)} ${t("台", "units")} · ${percent(data.age[4].count,data.total)}`;

    const flow = [
      [t('库存车辆','Vehicles in stock'),data.total,'#eeeeee'],
      [t('已配销售单','Sales order allocated'),data.sales,'#398fcd'],
      [t('已配发运单','Dispatch order linked'),data.dispatch,'#398fcd'],
    ];
    const flowRows = flow.map(([label,count,color]) => {
      const item = node('div','flow-item');
      const top = node('div','flow-top');
      top.append(node('div','flow-label',label),node('div','flow-count',number(count)),node('div','flow-pct',percent(count,data.total)));
      top.style.setProperty('--fill',color);
      const track = node('div','flow-track');
      const fill = node('div','flow-fill');
      fill.style.setProperty('--width',`${data.total ? count / data.total * 100 : 0}%`);
      fill.style.setProperty('--fill',color);
      track.append(fill);item.append(top,track);return item;
    });
    replaceChildren($('flow-list'),flowRows);
    $('unallocated-note').textContent = `${number(data.unallocated)} ${t("台未配单", "unallocated")} · ${percent(data.unallocated,data.total)}`;
    $('flow-title').title = `${t('未配销售单','Unallocated')}: ${number(data.unallocated)} (${percent(data.unallocated,data.total)}); ${t('待关联发运单','Awaiting dispatch order')}: ${number(data.pending)} (${percent(data.pending,data.total)})`;
    $('pending-note').textContent = `${number(data.pending)} ${t("台已配单待发运", "awaiting dispatch order")} · ${percent(data.pending,data.total)}`;

    const heat = [];
    heat.push(node('div','heat-head',t('天','Days')));
    for(const label of ['0–30','31–60','61–90','91–180','>180']) heat.push(node('div','heat-head',label));
    for(const warehouse of data.warehouses) {
      const label = node('div','warehouse-label',warehouse.label);
      label.title = warehouse.name;
      label.append(node('small','',`${number(warehouse.count)} ${t("台", "units")} · ${percent(warehouse.count,data.total)}`));
      heat.push(label);
      for(const count of warehouse.age) {
        const ratio = warehouse.count ? count / warehouse.count : 0;
        const cell = node('div','heat-cell');
        if(count) cell.style.background = `rgba(43, 132, 194, ${(0.13+0.48*ratio).toFixed(3)})`;
        cell.append(node('strong','',number(count)),node('small','',percent(count,warehouse.count)));
        heat.push(cell);
      }
    }
    replaceChildren($('heatmap'),heat);

    const maxModel = Math.max(1,...data.models.map((item)=>item.count));
    const modelRows = data.models.map((model) => {
      const row = node('div','model-row');
      const label = node('div','model-name',model.name);
      label.title = `${model.name} · ${percent(model.count,data.total)} ${t('占总库存','of stock')}`;
      const track = node('div','model-track');
      track.style.setProperty('--width',`${model.count/maxModel*100}%`);
      const filled = node('div','model-filled');
      filled.style.setProperty('--fill-width',`${model.count?model.sales/model.count*100:0}%`);
      track.append(filled);
      row.append(label,node('div','model-share',percent(model.count,data.total)),track,
        node('div','model-ratio',`${number(model.sales)} / ${number(model.count)}`),
        node('div','model-rate',percent(model.sales,model.count)));
      return row;
    });
    replaceChildren($('model-list'),modelRows);

    const warnings = [];
    if(data.duplicates) warnings.push(t(`发现 ${number(data.duplicates)} 行重复 VIN，按最后一行统计`, `${number(data.duplicates)} duplicate VIN rows; last row used`));
    if(data.invalidDates) warnings.push(t(`${number(data.invalidDates)} 台入库日期无效，未计入库龄分段`, `${number(data.invalidDates)} invalid or future inbound dates; excluded from ageing`));
    if(data.anomalousDispatch) warnings.push(t(`${number(data.anomalousDispatch)} 台有发运单但无销售单，未计入已配发运单`, `${number(data.anomalousDispatch)} dispatch orders without sales orders; excluded from linked total`));
    setNotice(warnings);
    fitDashboard();
  }

  function xml(source, path) {
    const doc = new DOMParser().parseFromString(source,'application/xml');
    if(doc.getElementsByTagName('parsererror').length) throw new Error(`${t("Excel XML 无法读取：", "Unable to read Excel XML: ")}${path}`);
    return doc;
  }
  function tags(parent, name) { return [...parent.getElementsByTagNameNS('*',name)]; }
  function first(parent, name) { return parent.getElementsByTagNameNS('*',name)[0] || null; }
  function zipPath(target) {
    if(target.startsWith('/')) return target.slice(1);
    const parts = ['xl',...target.split('/')];
    const out=[];
    for(const part of parts){if(part==='..') out.pop();else if(part && part!=='.') out.push(part);}
    return out.join('/');
  }
  function columnIndex(address) {
    const match=/^[A-Z]+/.exec(address || '');
    if(!match) return -1;
    return [...match[0]].reduce((n,char)=>n*26+char.charCodeAt(0)-64,0)-1;
  }
  function headerKey(value) {
    return text(value).replace(/[\s\u00a0_]+/g,'').toLowerCase();
  }
  function identifyHeaders(row) {
    const cells = row.map(headerKey);
    const find = (...names) => cells.findIndex((cell) => names.includes(cell));
    const indexes = {
      vin: find('vin','vin号','车辆vin'), warehouse: find('库房','仓库'),
      model: find('车型','车系'), inbound: find('入库时间','首次入库时间'),
      sales: find('销售单号'), dispatch: find('发运单号'),
    };
    return Object.values(indexes).every((index)=>index>=0) ? indexes : null;
  }
  function parseSheet(sheetDoc, sharedStrings) {
    const rows=[];
    for(const row of tags(sheetDoc,'row')) {
      const cells=[];
      for(const cell of tags(row,'c')) {
        const index=columnIndex(cell.getAttribute('r'));
        if(index<0) continue;
        const type=cell.getAttribute('t');
        let value=null;
        if(type==='inlineStr') value=tags(cell,'t').map((t)=>t.textContent).join('');
        else {
          const raw=first(cell,'v')?.textContent;
          if(raw!=null && raw!=='') {
            if(type==='s') value=sharedStrings[Number(raw)] ?? '';
            else if(type==='str'||type==='e'||type==='d') value=raw;
            else value=Number(raw);
          }
        }
        cells[index]=value;
      }
      rows.push(cells);
    }
    return rows;
  }
  async function readExcel(file) {
    if(!/\.xlsx$/i.test(file.name)) throw new Error(t('请选择 .xlsx 格式的 Excel 文件。','Select an .xlsx file.'));
    const zip=await window.JSZip.loadAsync(await file.arrayBuffer());
    const workbookFile=zip.file('xl/workbook.xml');
    if(!workbookFile) throw new Error(t('文件不是有效的 .xlsx 工作簿。','Invalid .xlsx workbook.'));
    const workbookXml=xml(await workbookFile.async('string'),'workbook.xml');
    const date1904=['1','true'].includes(first(workbookXml,'workbookPr')?.getAttribute('date1904'));
    const relFile=zip.file('xl/_rels/workbook.xml.rels');
    if(!relFile) throw new Error(t('Excel 缺少工作表关系文件。','Missing worksheet relationship file.'));
    const relXml=xml(await relFile.async('string'),'workbook.xml.rels');
    const relationships=new Map(tags(relXml,'Relationship').map((item)=>[item.getAttribute('Id'),zipPath(item.getAttribute('Target')||'')]));
    const sharedFile=zip.file('xl/sharedStrings.xml');
    const sharedStrings=sharedFile ? tags(xml(await sharedFile.async('string'),'sharedStrings.xml'),'si').map((item)=>tags(item,'t').map((part)=>part.textContent).join('')) : [];
    const sheets=tags(workbookXml,'sheet').map((item)=>({name:item.getAttribute('name'),id:item.getAttribute('r:id')||item.getAttributeNS('http://schemas.openxmlformats.org/officeDocument/2006/relationships','id')}));
    sheets.sort((a,b)=>(a.name==='库存明细列表'?-1:0)-(b.name==='库存明细列表'?-1:0));
    for(const sheet of sheets) {
      const path=relationships.get(sheet.id);
      const entry=path && zip.file(path);
      if(!entry) continue;
      const rows=parseSheet(xml(await entry.async('string'),path),sharedStrings);
      const headerPosition=rows.slice(0,50).findIndex((row)=>identifyHeaders(row));
      if(headerPosition<0) continue;
      const columns=identifyHeaders(rows[headerPosition]);
      const records=rows.slice(headerPosition+1).map((row)=>({
        vin:row[columns.vin],warehouse:row[columns.warehouse],model:row[columns.model],
        inbound:row[columns.inbound],sales:row[columns.sales],dispatch:row[columns.dispatch],date1904,
      }));
      // A valid table with no VIN rows is a legitimate zero-inventory snapshot.
      return {records,sheetName:sheet.name};
    }
    throw new Error(t('没有找到包含 Vin、库房、车型、入库时间、销售单号、发运单号的明细表。','Required columns: VIN, warehouse, model, inbound date, sales order and dispatch order.'));
  }

  async function loadFile(file) {
    if(!file) return;
    $('source-status').textContent=`${t("正在读取", "Reading")} ${file.name}…`;
    try {
      const {records,sheetName}=await readExcel(file);
      const data=aggregate(records,new Date());
      const meta={loadedAt:localIso(new Date()),sourceLabel:`${t("已加载", "Loaded")} ${file.name} · ${sheetName} · ${number(data.total)} 台`};
      if(SHARED_MODE) {
        if(SHARED_MODE!=='admin') throw new Error(t('此页面仅供查看，请使用管理员上传页。','Use the admin page to upload.'));
        const password=$('admin-password').value;
        if(!password) throw new Error(t('请先输入上传密码。','Enter the upload password first.'));
        const response=await fetch(API_URL,{method:'PUT',headers:{'Content-Type':'application/json','Authorization':`Bearer ${password}`},body:JSON.stringify({data,meta})});
        if(!response.ok) {
          const error=await response.json().catch(()=>({error:t('发布失败','Publish failed')}));
          throw new Error(error.error||`${t("发布失败", "Publish failed")} (${response.status})`);
        }
        meta.sourceLabel=`${t("已发布", "Published")} ${file.name} · ${sheetName} · ${number(data.total)} 台`;
      }
      hasLiveData = true;
      render(data,meta);
      document.body.classList.remove('tools-open');
      if(!SHARED_MODE) try { localStorage.setItem(STORAGE_KEY,JSON.stringify({data,meta})); } catch (_) { /* Local storage may be disabled for file URLs. */ }
    } catch(error) {
      $('source-status').textContent=current.meta?.sourceLabel || seed.meta.sourceLabel;
      setNotice([`${t('导入失败：','Import failed: ')}${error?.message || t('无法读取文件','Unable to read file')}`]);
    }
  }

  for (const view of ['age','flow','warehouse','model']) $('view-'+view).addEventListener('click',()=>{
    $('dashboard').dataset.view = view;
    for (const key of ['age','flow','warehouse','model']) $('view-'+key).setAttribute('aria-pressed',String(key === view));
  });
  for (const code of ['zh','en']) $('lang-'+code).addEventListener('click',()=>{
    language=code;
    try { localStorage.setItem('inventory-language',code); } catch (_) {}
    render(current.data,current.meta);
    if(!hasLiveData) setNotice([t("正在读取最新 Excel 汇总…","Loading latest Excel summary…")]);
  });
  $('excel-input').addEventListener('change',(event)=>{loadFile(event.target.files?.[0]);event.target.value='';});
  $('tools-toggle').addEventListener('click',()=>document.body.classList.add('tools-open'));
  $('close-tools').addEventListener('click',()=>document.body.classList.remove('tools-open'));
  document.addEventListener('keydown',(event)=>{if(event.key==='Escape') document.body.classList.remove('tools-open');});
  window.addEventListener('resize',fitDashboard);
  document.fonts?.ready.then(fitDashboard);
  $('print-button').addEventListener('click',()=>window.print());
  const dropZone=$('drop-zone');
  document.addEventListener('dragover',(event)=>{event.preventDefault();document.body.classList.add('drop-active');});
  document.addEventListener('dragleave',(event)=>{if(!event.relatedTarget) document.body.classList.remove('drop-active');});
  document.addEventListener('drop',(event)=>{event.preventDefault();document.body.classList.remove('drop-active');loadFile(event.dataTransfer?.files?.[0]);});
  if(SHARED_MODE) document.body.classList.add(SHARED_MODE==='admin'?'shared-admin':'shared-viewer');
  else try {
    const saved=JSON.parse(localStorage.getItem(STORAGE_KEY)||'null');
    if(saved?.data && saved?.meta) current=saved;
  } catch (_) { /* Use the bundled source snapshot. */ }
  render(current.data,current.meta);
  if(SHARED_MODE) {
    const refresh=async()=>{
      try {
        const response=await fetch(API_URL,{cache:'no-store'});
        if(response.status===404) throw new Error("No published snapshot");
        if(!response.ok) throw new Error(`HTTP ${response.status}`);
        const latest=await response.json();
        if(!latest?.data || !latest?.meta) throw new Error("Invalid snapshot");
        hasLiveData = true;
        render(latest.data,latest.meta);
      } catch (_) { setNotice([t('在线数据暂时无法读取，请稍后刷新页面。','Live data unavailable. Please refresh later.')]); }
    };
    setNotice([t('正在读取最新 Excel 汇总…','Loading latest Excel summary…')]);
    refresh();
    document.addEventListener('visibilitychange',()=>{if(!document.hidden) refresh();});
  }
})();
